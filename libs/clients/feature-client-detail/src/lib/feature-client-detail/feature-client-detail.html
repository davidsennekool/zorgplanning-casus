<p class="text-xs cursor-pointer w-fit" routerLink="..">Back to clients</p>
<div class="flex flex-row">
  <h1 class="text-2xl pb-4 pt-2">Appointments</h1>

  <button class="ml-auto cursor-pointer h-fit my-auto bg-blue-400 text-white py-2 px-4 rounded-sm hover:bg-blue-500"
    (click)="toggleAppointmentForm()">
    New appointment
  </button>
</div>

@if (showAppointmentForm()) {
@let healthCareProviderControl = appointmentForm.controls.healthCareProvider;
@let dateControl = appointmentForm.controls.date;
@let careTypeControl = appointmentForm.controls.careType;

<form (submit)="createAppointment()" class="bg-gray-200 rounded-md my-4 flex flex-col p-4 gap-y-3">
  <lib-ui-form-field [control]="dateControl" label="Appointment date" id="appointment-date" [required]="true"
    type="date" />

  <lib-ui-form-field [control]="healthCareProviderControl" label="Health care provider"
    id="appointment-health-care-provider" [required]="true" type="text" placeholder="Zorg Groep Noord-Nederland" />

  <lib-ui-form-field [control]="careTypeControl" label="Care type" id="appointment-care-type" [required]="true"
    placeholder="Physical therapy, dental care eg." type="text" />

  <button type="submit"
    class="cursor-pointer h-fit bg-blue-400 text-white py-2 px-4 rounded-sm hover:bg-blue-500">Create
    appointment</button>
</form>
}

<lib-feature-appointment-table [appointments]="appointments"
  (sortAppointmentsByDate)="sortAppointmentsByDate($event)" />
